{% extends 'main.html'%}
{% block content %}

<style>
    .home-container
    {
        display: grid;
        grid-template-columns: 1fr 3fr;
    }
</style>

<div class="home-container ">

    <div>
        <h3>Browse Topics</h3>
        <hr>
        <div>
            <a href="{% url 'home' %}">All</a>
        </div>
        {% for topic in topics %}
        <div>
            <a href="{% url 'home' %}?q={{topic.name}}">{{topic.name}}</a>
        </div>
        {% endfor %}
    </div>

    <div>
        <h5>{{room_count}} Room Available</h5>
        <a href="{% url 'create-room'%}">Create room</a>
        <div>
            {% for room in rooms %}

            <div>
                <a href="{% url 'update-room' room.id %}">Edit</a>
                <a href="{% url 'delete-room' room.id %}">Delete</a>
                <span style="background-color: yellow;">@{{room.host.username}}</span>
                <h1>{{room.id}}--<a href="{% url 'room' room.id %}">{{room.name}}</h1></a>
                <small style="background-color: aliceblue;">{{room.topic.name}}</small>
                 <hr>
            </div>

            {% endfor %}
        </div>
        
    </div> 

</div>

{% endblock %}


 <!--/room/{{room.id}}-->
