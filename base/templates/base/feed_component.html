<div>
            {% for room in rooms %}

            <div>
                {% if request.user == room.host %}
                <a href="{% url 'update-room' room.id %}">Edit</a>
                <a href="{% url 'delete-room' room.id %}">Delete</a>
                {% endif %}
                <span style="background-color: rgb(125, 126, 126);"><a href="{% url 'user-profile' room.host.id %}">@{{room.host.username}}</a></span>
                <h1>{{room.id}}--<a href="{% url 'room' room.id %}">{{room.name}}</h1></a>
                <small style="background-color: aliceblue;">{{room.topic.name}}</small>
                 <hr>
            </div>

            {% endfor %}
        </div>
